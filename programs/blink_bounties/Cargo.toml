[package]
name = "blink_bounties"
version = "0.1.0"
description = "Trustless escrow bounties for Solana Blinks"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "blink_bounties"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
